name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ypm-user
          POSTGRES_PASSWORD: ypm-password
          POSTGRES_DB: ypm-test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
        env:
          TEST_POSTGRES_URL: postgres://ypm-user:ypm-password@localhost:5433/ypm-test
